# HTTPS directly in Nginx. Requires a valid certificate and production env file.
services:
  db:
    ports: !reset []
  migrate:
    environment:
      NODE_ENV: production
      SEED_DEMO: "false"
      TRUSTED_PROXY_IPS: 172.30.0.10
  api:
    environment:
      NODE_ENV: production
      SEED_DEMO: "false"
      TRUSTED_PROXY_IPS: 172.30.0.10
  web:
    ports: !override
      - "127.0.0.1:${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./frontend/docker/https.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - tls_certificate
      - tls_private_key
    networks:
      default:
        ipv4_address: 172.30.0.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

secrets:
  tls_certificate:
    file: ./.docker/tls/fullchain.pem
  tls_private_key:
    file: ./.docker/tls/privkey.pem
