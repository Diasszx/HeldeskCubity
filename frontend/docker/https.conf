server {
    listen 8080;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / { return 404; }
}

server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    include /etc/nginx/locations.conf;
}
