name: cubity-support

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .docker/database.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: cubity_support_test
      POSTGRES_USER: cubity_test
      POSTGRES_PASSWORD: cubity-test-demo
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U cubity_test -d cubity_support_test",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
